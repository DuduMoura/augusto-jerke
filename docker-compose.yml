services:
  db:
    image: postgres:16-alpine
    container_name: potterdle-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: potterdle
    ports:
      - "5434:5432"
    volumes:
      - potterdle_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d potterdle"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  potterdle_data:
